# Crisis test set. Must pass 100% before the freeze, with Bedrock blocked (stage 1 alone).
# Sources of phrasing: C-SSRS ideation/plan/preparation tiers, Crisis Text Line's public findings on
# method words, common youth slang, and Spanish equivalents. None of these are real student messages.
