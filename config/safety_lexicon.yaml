# Stage-1 crisis lexicon. Regexes run on several normalized variants of the text (lowercase,
# accents stripped, repeated letters collapsed, leetspeak mapped). Bias: catch every real case.
# Informed by Crisis Text Line's published finding that method words (pills, specific drugs, bridges)
# predict imminent risk better than the word "suicide" itself, and by C-SSRS ideation/plan/preparation tiers.
#
# crisis  -> fixed crisis card, nothing else runs.
# concern -> request proceeds; a gentle "people you can talk to" block is added; free text not used further.
# idioms  -> only cancel a CONCERN match that overlaps them. They never cancel a crisis match.

crisis:
  # ideation (direct)
  - '\b(kill|killing|hurt|hurting|harm|harming|cut|cutting|hang|hanging|shoot|shooting|drown|drowning|poison|poisoning|starve|starving) (my ?self|myself)\b'
  - '\bk ?m ?s\b'
  - '\bsuicid(e|al)\b'
  - '\bself[- ]?(harm|harming|injur\w*)\b'
  - '\b(end|ending|take|taking) (my|my own) (life|lifes)\b'
  - '\bend(ing)? it all\b'
  - '\bun ?aliv(e|ing) (my ?self|myself|me)\b'
  - '\bunalive\b'
  - '\b(want|wanna|wish|wishing|going|gonna|ready) (to )?(die|be dead|not exist|not be alive|disappear forever|stop existing)\b(?! (my|your|his|her|their|the) (hair|clothes|shirt|shoes|jeans|eggs|fabric))'
  - '\bi (want|wanna|wish i could) (just )?die\b(?! (my|your|his|her|their|the) (hair|clothes|shirt|shoes|jeans|eggs|fabric))'
  - '\bhope (i|that i) (don t|dont|do not|never|won t|wont) wake up\b'
  - '\bwish i (was|were) (dead|never born)\b'
  - '\bbetter off (dead|without me)\b'
  - '\b(everyone|everybody|they|the world|my family) (would|will) be better off without me\b'
  - '\bno(body|one) would (miss|notice|care if) (me|i)\b'
  - '\b(dont|do not|don t) want to (be alive|live|exist|be here anymore|wake up)\b'
  - '\b(no|not any) (reason|point) (to|in) (live|living|being alive|going on)\b'
  - '\bcan ?t (go on|keep going|keep living|do this anymore)( living)?\b.*\b(life|living|alive|anymore)\b'
  - '\bsleep forever\b'
  - '\bnot wake up\b'
  - '\bnever wake up\b'
  # plan / method / preparation
  - '\b(overdose|overdosing|od on|o d on)\b'
  - '\b(took|take|taking|swallow\w*|downed|down) (a bunch of|all (of )?my|too many|a whole bottle of|the whole bottle of|all the|like \d+) (pills|tablets|meds|medication|sleeping pills|tylenol|advil|ibuprofen|acetaminophen)\b'
  - '\b\d{3,4} ?mg\b.*\b(all|whole|bottle|at once)\b'
  - '\b(jump|jumping) (off|from) (a|the|my) (bridge|roof|building|balcony|parking deck|overpass)\b'
  - '\b(noose|rope) (for|around) (me|my neck|myself)\b'
  - '\bgun to my head\b'
  - '\b(suicide|goodbye) (note|letter)\b'
  - '\b(saying|said) goodbye to (everyone|everybody|my family|all of you)\b'
  - '\bgiv(e|ing) away (all )?my (stuff|things|belongings)\b.*\b(wont|won t|not) need\b'
  - '\bplan(ning)? (to|how to) (end|kill|die)\b'
  - '\b(how|ways) to (kill|end) (my ?self|myself|my life)\b'
  - '(💊\s*){2,}'
  - '🔫.*\b(me|my|myself)\b|\b(me|my|myself)\b.*🔫'
  - '(🪦|⚰️|⚰)'
  # Spanish
  - '\b(me )?quiero morir(me)?\b'
  - '\bquiero estar muert[oa]\b'
  - '\b(me quiero|quiero|voy a) matar(me)?\b'
  - '\bmatarme\b'
  - '\bsuicid(io|arme|a)\b'
  - '\bno quiero (vivir|seguir viviendo|despertar|existir)\b'
  - '\bquitarme la vida\b'
  - '\b(acabar|terminar) con (todo|mi vida)\b'
  - '\b(estaria|estarian|estarian todos) mejor sin mi\b'
  - '\bmejor (estaria|estar) muert[oa]\b'
  - '\b(cortarme|hacerme dano|lastimarme)\b'
  - '\bsobredosis\b'
  - '\b(tomar|tome|tomarme) todas las pastillas\b'
  - '\bdormir para siempre\b'

concern:
  - '\bhopeless\b'
  - '\bworthless\b'
  - '\bcan ?t (take|handle|do) (it|this) any ?more\b'
  - '\bi give up\b'
  - '\bgive up on (everything|life)\b'
  - '\b(want|wanna) to disappear\b'
  - '\bno ?(body|one) cares\b'
  - '\b(so|really|completely|totally) (alone|empty|numb)\b'
  - '\bempty inside\b'
  - '\bhate (my ?self|myself)\b'
  - '\b(i m|im|i am) a burden\b'
  - '\b(falling apart|breaking down|losing it)\b'
  - '\bpanic attacks?\b'
  - '\bcan ?t stop crying\b'
  - '\bcry(ing)? (every|each) (night|day)\b'
  - '\bhaven ?t (eaten|slept) in days\b'
  - '\b(nothing|no one) (matters|helps)\b'
  - '\b(dark|bad) (place|thoughts)\b'
  - '\bkill (him|her|them|you|my roommate|my professor)\b'
  - '\bkys\b'
  - '\bno puedo mas\b'
  - '\bya no aguanto( mas)?\b'
  - '\b(me siento|estoy) (muy |tan )?(sol[oa]|vaci[oa]|sin esperanza)\b'
  - '\bno valgo nada\b'
  - '\bnadie me quiere\b'

idioms:
  - '\b(this|that|the|my|these|those) \w+( \w+)? (is|are|was|were) killing me\b'
  - '\bkilling me\b'
  - '\bdead tired\b'
  - '\bdying to\b'
  - '\bdying (of|from) laughter\b'
  - '\bkilled it\b'
  - '\bto die for\b'
  - '\bmy (phone|battery|laptop) (is|was) dead\b'
  - '\bme muero de (hambre|risa|sueno|ganas)\b'
  - '\bme mata(n)? de risa\b'
