# Next-step engine. ScarletWell can tune every number here without touching code.
version: "engine-1.0"
weights:            # fit first...
  dimension: 0.35
  barrier: 0.25
  window: 0.20
  rung: 0.10
  helped_similar: 0.10
horizon_days: 10
min_window_fit: 0.6          # events must be at least this much inside a free window (when the student has windows)
drop_in_minutes: 45          # long events (fairs, markets) count as drop-ins of this length
long_event_minutes: 120
no_window_score: 0.5         # student gave no windows
open_place_score: 0.8        # place/resource with published hours open in a window
unknown_hours_score: 0.5     # hours not published: passes, never invented
online_anytime_score: 0.8
root_cause_score: 0.7        # item addresses the root cause the student named (e.g. coursework -> sleep)
distance:                    # ...distance second
  walk_m_per_min: 80
  detour_factor: 1.3
  free_minutes: 15           # no penalty up to a 15-minute walk
  penalty_per_5_min: 0.01
  default_walk_min: 5
memory:
  per_fact_max: 0.05
  total_cap: 0.10
helped_prior_strength: 5     # Beta prior pseudo-count (cohort mean as prior)
helped_default_prior: 0.6
explore: false               # Thompson sampling behind a flag; seeded per (student, week) when on
rung_after_good_rating: 1    # move up one rung after a step rated 4-5 (max 3)
diversity_min_diff: 2        # alternates differ in at least this many of kind/venue/weekday/rung/series

rung_labels:
  1: "Just show up"
  2: "Structured: you'll be doing something, not mingling"
  3: "Open social"
rung_labels_es:
  1: "Solo ve"
  2: "Estructurado: vas a hacer algo, no a socializar"
  3: "Social abierto"

campus_anchors:              # where walking time is measured from, by campus / home area
  newark: {lat: 40.7415, lon: -74.1752, label: "Paul Robeson Campus Center"}
  camden: {lat: 39.9483, lon: -75.1224, label: "Camden Campus Center"}
  new_brunswick: {lat: 40.5008, lon: -74.4474, label: "College Avenue"}
  Busch: {lat: 40.5233, lon: -74.4583, label: "Busch Student Center"}
  Livingston: {lat: 40.5240, lon: -74.4369, label: "Livingston Student Center"}
  College Avenue: {lat: 40.5008, lon: -74.4474, label: "College Avenue Student Center"}
  Cook/Douglass: {lat: 40.4806, lon: -74.4359, label: "Cook/Douglass"}
